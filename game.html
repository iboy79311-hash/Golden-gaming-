<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Gaming - Play</title><style>body{margin:0;background:#02070b;color:#fff;font-family:Arial;text-align:center}main{max-width:850px;margin:30px auto;padding:18px;background:#090d12;border:2px solid #d9a72e;border-radius:14px}h1{color:#ffd84d}canvas{width:100%;background:#111;border-radius:8px}a{display:inline-block;margin-top:15px;padding:10px 22px;border-radius:8px;background:#35a900;color:#fff;text-decoration:none;font-weight:bold}</style></head><body><main><h1 id="title">Golden Game</h1><canvas id="game" width="760" height="420"></canvas><p>Arrow keys / WASD se player ko move karo.</p><a href="index.html">← BACK TO GOLDEN GAMING</a></main><script>const q=new URLSearchParams(location.search);document.getElementById('title').textContent=q.get('game')||'Golden Game';const c=document.getElementById('game'),x=c.getContext('2d');let px=380,py=210,k={};onkeydown=e=>k[e.key.toLowerCase()]=1;onkeyup=e=>k[e.key.toLowerCase()]=0;function loop(){x.fillStyle='#111';x.fillRect(0,0,760,420);x.fillStyle='#222';for(let i=0;i<760;i+=70)x.fillRect(i,0,35,420);if(k.a||k.arrowleft)px-=4;if(k.d||k.arrowright)px+=4;if(k.w||k.arrowup)py-=4;if(k.s||k.arrowdown)py+=4;px=Math.max(20,Math.min(740,px));py=Math.max(20,Math.min(400,py));x.fillStyle='#35a900';x.fillRect(px-18,py-18,36,36);x.fillStyle='#fff';x.font='24px Arial';x.fillText('★',px-9,py+9);requestAnimationFrame(loop)}loop();</script></body></html>
